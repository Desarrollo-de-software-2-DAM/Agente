services:
  db:
    image: postgres:16-alpine
    container_name: agente_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amershop_net

  backend:
    build:
      context: ./backend
    container_name: agente_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      # Índice vectorial FAISS: se genera en el primer arranque y se conserva entre reinicios
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 10
      start_period: 120s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - amershop_net

  frontend:
    build:
      context: ./frontend
    container_name: agente_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - amershop_net

networks:
  amershop_net:
    driver: bridge

volumes:
  pgdata:
  chroma_data:
  model_cache:

  